name: Free RDP with Bore

on: workflow_dispatch

jobs:
  setup-rdp-tunnel:
    runs-on: windows-2025
    steps:
    - name: Check out the repository
      uses: actions/checkout@v2

    - name: Download and Install Bore
      run: |
        Write-Host "📥 Скачиваем Bore для Windows..."
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile "$env:USERPROFILE\bore.zip"
        
        Write-Host "📦 Распаковываем Bore..."
        Expand-Archive -Path "$env:USERPROFILE\bore.zip" -DestinationPath "$env:USERPROFILE\bore" -Force
        
        Write-Host "🔧 Настраиваем Bore..."
        Move-Item -Path "$env:USERPROFILE\bore\bore.exe" -Destination "$env:USERPROFILE\bore.exe" -Force
        
        Write-Host "✅ Bore установлен успешно!"
        Start-Sleep -Seconds 3

    - name: Enable Remote Desktop (RDP) and Sound with Full Settings
      run: |
        Write-Host "🖥️ Настраиваем RDP сервер..."
        
        # Полная настройка RDP
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        # Настройка брандмауэра
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow
        
        # Включение звука
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudio" -Value 0
        Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue
        Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
        
        # Включение сервиса терминалов
        Start-Service -Name "TermService" -ErrorAction SilentlyContinue
        Set-Service -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue
        gpupdate /force
        
        Write-Host "✅ RDP настроен успешно!"

    - name: Set RDP Password
      run: |
        Write-Host "🔐 Устанавливаем пароль для RDP..."
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "Magisk2024!@#GitLab" -Force)
        Write-Host "✅ Пароль установлен!"
    
    - name: Download Programs and Setup
      run: |
        Write-Host "📦 Настраиваем программы и файлы..."
        New-Item -Path "$env:USERPROFILE\Downloads" -ItemType Directory -Force
        
        Write-Host "📥 Скачиваем Discord..."
        try {
            Invoke-WebRequest -Uri "https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x86" -OutFile "$env:USERPROFILE\Downloads\DiscordSetup.exe" -TimeoutSec 30
            Start-Sleep -Seconds 5
            
            Write-Host "🚀 Устанавливаем Discord..."
            Start-Process -FilePath "$env:USERPROFILE\Downloads\DiscordSetup.exe" -ArgumentList "-s" -Wait -NoNewWindow -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 10
            
            Write-Host "🔗 Создаем ярлык Discord..."
            $WshShell = New-Object -comObject WScript.Shell
            $Shortcut = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\Discord.lnk")
            $Shortcut.TargetPath = "$env:LOCALAPPDATA\Discord\Discord.exe"
