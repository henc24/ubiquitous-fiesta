        # Включение сервиса терминалов
        Start-Service -Name "TermService" -ErrorAction SilentlyContinue
        Set-Service -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue
        gpupdate /force
        
        Write-Host "✅ RDP настроен успешно!"

    - name: Set RDP Password
      run: |
        Write-Host "🔐 Устанавливаем пароль для RDP..."
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "Magisk2024!@#GitLab" -Force)
        Write-Host "✅ Пароль установлен!"
    
    - name: Download Programs and Setup
      run: |
        Write-Host "📦 Настраиваем программы и файлы..."
        New-Item -Path "$env:USERPROFILE\Downloads" -ItemType Directory -Force
        
        Write-Host "📥 Скачиваем Discord..."
        try {
            Invoke-WebRequest -Uri "https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x86" -OutFile "$env:USERPROFILE\Downloads\DiscordSetup.exe" -TimeoutSec 30
            Start-Sleep -Seconds 5
            
            Write-Host "🚀 Устанавливаем Discord..."
            Start-Process -FilePath "$env:USERPROFILE\Downloads\DiscordSetup.exe" -ArgumentList "-s" -Wait -NoNewWindow -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 10
            
            Write-Host "🔗 Создаем ярлык Discord..."
            $WshShell = New-Object -comObject WScript.Shell
            $Shortcut = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\Discord.lnk")
            $Shortcut.TargetPath = "$env:LOCALAPPDATA\Discord\Discord.exe"
            $Shortcut.Save()
        } catch {
            Write-Host "⚠️ Ошибка установки Discord: $($_.Exception.Message)"
        }
        
        Write-Host "📥 Скачиваем Cursor AI..."
        try {
            Invoke-WebRequest -Uri "https://downloads.cursor.com/production/82ef0f61c01d079d1b7e5ab04d88499d5af500e3/win32/x64/user-setup/CursorUserSetup-x64-0.47.8.exe" -OutFile "$env:USERPROFILE\Downloads\CursorSetup.exe" -TimeoutSec 30
        } catch {
            Write-Host "⚠️ Ошибка скачивания Cursor: $($_.Exception.Message)"
        }
        
        Write-Host "📥 Загружаем файлы с Dropbox..."
        try {
            Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/omm8vuc3o1abtdub52ij2/discord.txt?rlkey=9ukyaduh4gu5hhb6o1dydr4k1&st=gvmrilg4&dl=1" -OutFile "$env:USERPROFILE\Downloads\discord.txt" -TimeoutSec 30
            Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/ox06ztofmpbuvshwrritx/.zip?rlkey=5exqz94rfcuf140zbcigwmdcg&st=1lnerd0w&dl=1" -OutFile "$env:USERPROFILE\Downloads\additional.zip" -TimeoutSec 30
        } catch {
            Write-Host "⚠️ Ошибка скачивания файлов: $($_.Exception.Message)"
        }
        
        Write-Host "⌨️ Добавляем русскую раскладку..."
        try {
            Set-ItemProperty -Path "HKCU:\Keyboard Layout\Preload" -Name "1" -Value "00000409" -Type String -ErrorAction SilentlyContinue
            Set-ItemProperty -Path "HKCU:\Keyboard Layout\Substitutes" -Name "00000409" -Value "00000419" -Type String -ErrorAction SilentlyContinue
            Set-ItemProperty -Path "HKCU:\Keyboard Layout\Toggle" -Name "Hotkey" -Value "1" -Type String -ErrorAction SilentlyContinue
            Set-ItemProperty -Path "HKCU:\Keyboard Layout\Toggle" -Name "Language Hotkey" -Value "1" -Type String -ErrorAction SilentlyContinue
            Set-ItemProperty -Path "HKCU:\Keyboard Layout\Toggle" -Name "Layout Hotkey" -Value "3" -Type String -ErrorAction SilentlyContinue
        } catch {
            Write-Host "⚠️ Ошибка настройки раскладки: $($_.Exception.Message)"
        }
        
        Write-Host "🎤 Включаем микрофон..."
        try {
            Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone" -Name "Value" -Value "Allow" -Type String -ErrorAction SilentlyContinue
        } catch {
            Write-Host "⚠️ Ошибка настройки микрофона: $($_.Exception.Message)"
        }
        
        Write-Host "✅ Установка программ завершена!"

    - name: Start Bore Tunnel and Keep Alive
      run: |
        Write-Host "🚀 Запускаем Bore туннель для RDP..."
        
        # Проверяем, что RDP работает
        $rdpService = Get-Service -Name "TermService" -ErrorAction SilentlyContinue
        if ($rdpService.Status -ne "Running") {
            Write-Host "⚠️ RDP сервис не запущен, запускаем..."
            Start-Service -Name "TermService" -ErrorAction SilentlyContinue
        }
        
        # Запускаем Bore туннель в фоне с перенаправлением вывода
        Write-Host "🔗 Создаем туннель на bore.pub..."
        $boreJob = Start-Job -ScriptBlock {
            & "$env:USERPROFILE\bore.exe" local 3389 --to bore.pub
        }
        
        Start-Sleep -Seconds 15
        
        # Проверяем статус job
        $jobState = Get-Job -Id $boreJob.Id | Select-Object -ExpandProperty State
        if ($jobState -eq "Running") {
            Write-Host "✅ Bore туннель успешно запущен в фоне!"
            
            # Пытаемся получить вывод для адреса
            $jobOutput = Receive-Job -Id $boreJob.Id -Keep
            if ($jobOutput) {
                Write-Host "📋 Вывод Bore:"
                $jobOutput | ForEach-Object { Write-Host $_ }
            }
        } else {
            Write-Host "❌ Ошибка запуска Bore job, пробуем альтернативный способ..."
            
            # Альтернативный запуск через Start-Process
            $boreProcess = Start-Process -FilePath "$env:USERPROFILE\bore.exe" -ArgumentList "local", "3389", "--to", "bore.pub" -WindowStyle Hidden -PassThru
            Start-Sleep -Seconds 10
            
            if ($boreProcess -and !$boreProcess.HasExited) {
                Write-Host "✅ Bore запущен через Start-Process!"
            }
        }
        
        # Выводим информацию для подключения
        Write-Host ""
        Write-Host "=" * 50
        Write-Host "📋 ИНФОРМАЦИЯ ДЛЯ RDP ПОДКЛЮЧЕНИЯ"
        Write-Host "=" * 50
        Write-Host "👤 Имя пользователя: runneradmin"
        Write-Host "🔐 Пароль: Magisk2024!@#GitLab"
        Write-Host "� Локаольный порт: 3389"
        Write-Host "🌐 Публичный адрес: bore.pub:[случайный_порт]"
        Write-Host "💡 Адрес показан выше в логах Bore"
        Write-Host "🖥️ Используйте любой RDP клиент для подключения"
        Write-Host "=" * 50
        Write-Host ""
        
        Write-Host "⏰ Поддерживаем работу туннеля..."
        Write-Host "🛑 Для остановки прервите выполнение workflow"
        Write-Host "📊 Туннель будет работать в течение ~6 часов"
        
        # Основной цикл поддержания работы
        $startTime = Get-Date
        $maxRunTime = New-TimeSpan -Hours 5 -Minutes 50
        $lastCheck = Get-Date
        
        while ((Get-Date) - $startTime -lt $maxRunTime) {
            try {
                # Проверяем каждые 2 минуты
                if ((Get-Date) - $lastCheck -gt (New-TimeSpan -Minutes 2)) {
                    
                    # Проверяем Bore job
                    $currentJobState = Get-Job -Id $boreJob.Id -ErrorAction SilentlyContinue | Select-Object -ExpandProperty State
                    if ($currentJobState -ne "Running") {
                        Write-Host "⚠️ Bore job остановлен, перезапускаем..."
                        Remove-Job -Id $boreJob.Id -Force -ErrorAction SilentlyContinue
                        
                        $boreJob = Start-Job -ScriptBlock {
                            & "$env:USERPROFILE\bore.exe" local 3389 --to bore.pub
                        }
                        Start-Sleep -Seconds 10
                        
                        # Показываем новый адрес
                        $newOutput = Receive-Job -Id $boreJob.Id -Keep
                        if ($newOutput) {
                            Write-Host "🔗 Новый адрес Bore:"
                            $newOutput | ForEach-Object { Write-Host $_ }
                        }
                    }
                    
                    # Проверяем RDP сервис
                    $rdpService = Get-Service -Name "TermService" -ErrorAction SilentlyContinue
                    if ($rdpService.Status -ne "Running") {
                        Write-Host "⚠️ RDP сервис остановлен, перезапускаем..."
                        Start-Service -Name "TermService" -ErrorAction SilentlyContinue
                    }
                    
                    $lastCheck = Get-Date
                    Write-Host "✅ Проверка завершена - $(Get-Date -Format 'HH:mm:ss')"
                }
                
                Start-Sleep -Seconds 30
                
            } catch {
                Write-Host "❌ Ошибка в цикле мониторинга: $($_.Exception.Message)"
                Start-Sleep -Seconds 60
            }
        }
        
        Write-Host "⏰ Время выполнения истекло, завершаем работу..."
        Remove-Job -Id $boreJob.Id -Force -ErrorAction SilentlyContinue
